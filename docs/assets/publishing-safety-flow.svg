<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">X-Agent Manager publishing safety flow</title><desc id="desc">A request is deduplicated, journaled, browser-verified, then completed or marked uncertain.</desc>
  <rect width="1200" height="330" fill="#0b1020" rx="24"/>
  <style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#e8edff}.s{font-size:18px;fill:#aab8df}.t{font-size:24px;font-weight:700}.box{fill:#141c33;stroke:#4b72c8;stroke-width:2}.good{fill:#103928;stroke:#36bd7c}.warn{fill:#42251b;stroke:#f0ad4e}.line{stroke:#7ca3ff;stroke-width:3;fill:none}</style>
  <rect class="box" x="35" y="105" width="190" height="115" rx="16"/><text class="t" x="62" y="150">Request</text><text class="s" x="62" y="183">CLI / MCP / HTTP</text>
  <path class="line" d="M225 163H285"/><path fill="#7ca3ff" d="M285 163l-12-8v16z"/>
  <rect class="box" x="295" y="105" width="210" height="115" rx="16"/><text class="t" x="321" y="150">Idempotency</text><text class="s" x="321" y="183">same key → same result</text>
  <path class="line" d="M505 163H565"/><path fill="#7ca3ff" d="M565 163l-12-8v16z"/>
  <rect class="box" x="575" y="105" width="190" height="115" rx="16"/><text class="t" x="605" y="150">SQLite WAL</text><text class="s" x="605" y="183">steps and evidence</text>
  <path class="line" d="M765 163H825"/><path fill="#7ca3ff" d="M825 163l-12-8v16z"/>
  <rect class="box" x="835" y="105" width="165" height="115" rx="16"/><text class="t" x="863" y="150">Browser</text><text class="s" x="863" y="183">verified UI action</text>
  <path class="line" d="M1000 135H1050V82H1090"/><path class="line" d="M1000 192H1050V247H1090"/>
  <rect class="good" x="1090" y="38" width="90" height="88" rx="16"/><text class="t" x="1100" y="86">Done</text><text class="s" x="1099" y="109">URL saved</text>
  <rect class="warn" x="1090" y="202" width="90" height="88" rx="16"/><text class="t" x="1098" y="249">?</text><text class="s" x="1098" y="272">human</text>
</svg>
